Section "Device"
    Identifier "Wii KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "SWcursor" "true"
EndSection
Section "Screen"
    Identifier "Wii Screen"
    Device "Wii KMS"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "640x480"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
Section "Module"
    Disable "glx"
EndSection
